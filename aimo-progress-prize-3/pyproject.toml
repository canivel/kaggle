[project]
name = "aimo-progress-prize-3"
version = "0.1.0"
description = "AI Mathematical Olympiad Progress Prize 3 - LLM reasoning for IMO-level math"
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.13.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0.0",
    "rich>=13.9.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.26.0",
    "bm25s>=0.2.0",
    "polars>=1.0.0",
    "anthropic",
]

[project.optional-dependencies]
gpu = [
    "vllm>=0.6.0",
    "torch>=2.5.0",
    "transformers>=4.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimo3"]

[tool.uv.sources]
kaos = { path = "../kaos" }

[dependency-groups]
dev = [
    "kaos",
]
